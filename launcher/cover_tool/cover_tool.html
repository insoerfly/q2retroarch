<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover converter (.565) — MP5 X7 launcher</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: Segoe UI, system-ui, sans-serif; margin: 0; background:#0f1320; color:#e8ecf6; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 18px; }
  h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
  .card { background:#161c2e; border:1px solid #2a3450; border-radius:10px; padding:14px; margin-bottom:12px; }
  #drop { border:2px dashed #3a4a78; border-radius:10px; padding:22px; text-align:center; color:#9fb0d0; cursor:pointer; }
  #drop.over { border-color:#6e8ac0; background:#1a2238; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  label { color:#9fb0d0; font-size:13px; }
  input[type=number] { width:70px; background:#0d1220; color:#e8ecf6; border:1px solid #2a3450; border-radius:6px; padding:4px 6px; }
  button { background:#274a86; color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px; }
  button:disabled { background:#2a3450; color:#7a88a8; cursor:default; }
  button.ghost { background:#1d2740; }
  .pill { font-size:12px; padding:2px 8px; border-radius:10px; background:#1d2740; color:#9fb0d0; }
  .ok { color:#7ad27a; } .bad { color:#e07171; }
  #log { height:200px; overflow:auto; font-family:Consolas,monospace; font-size:12px; white-space:pre-wrap; background:#0d1220; border:1px solid #2a3450; border-radius:8px; padding:8px; }
  #list { max-height:150px; overflow:auto; font-size:12px; color:#9fb0d0; }
  .bar { height:8px; background:#0d1220; border-radius:4px; overflow:hidden; border:1px solid #2a3450; }
  .bar > i { display:block; height:100%; width:0; background:#3a63b0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cover converter → <code>.565</code> (MP5 X7 launcher)</h1>

  <div class="card">
    <div id="drop">Drop images here, or <u>click to choose files</u><br>
      <span class="pill">PNG · JPG · BMP · GIF · WebP</span></div>
    <input id="files" type="file" accept="image/*" multiple hidden>
    <div id="list"></div>
  </div>

  <div class="card">
    <div class="row">
      <label>Max size</label>
      <input id="mw" type="number" value="160" min="1"> ×
      <input id="mh" type="number" value="224" min="1">
      <label><input id="png" type="checkbox" checked> also save .png thumbs</label>
    </div>
    <div class="row">
      <button id="pickdir" class="ghost">Choose output folder…</button>
      <span id="dirmode" class="pill">no folder → files will download</span>
      <span id="dircount" class="pill" style="display:none"></span>
    </div>
    <div class="row">
      <button id="go">Convert</button>
      <span id="status" class="pill">idle</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="card"><div id="log"></div></div>
</div>

<script>
const EXTS = ["png","jpg","jpeg","bmp","gif","webp","tif","tiff"];
const $ = id => document.getElementById(id);
let files = [];
let dirHandle = null;

function log(s, cls){
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = s;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function isImg(name){ const e = name.split(".").pop().toLowerCase(); return EXTS.includes(e); }
function refreshList(){
  $("list").textContent = files.map(f => "• " + f.name).join("\n");
  $("dircount").style.display = files.length ? "inline-block" : "none";
  $("dircount").textContent = files.length + " file(s)";
}
function addFiles(list){
  for (const f of list) if (isImg(f.name) && !files.some(x => x.name === f.name)) files.push(f);
  refreshList();
}

$("drop").onclick = () => $("files").click();
$("files").onchange = e => addFiles(e.target.files);
["dragenter","dragover"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => addFiles(e.dataTransfer.files));

if ("showDirectoryPicker" in window){
  $("pickdir").onclick = async () => {
    try {
      dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
      $("dirmode").textContent = "output → " + dirHandle.name + "/";
    } catch(e){ /* cancelled */ }
  };
} else {
  $("pickdir").disabled = true;
  $("dirmode").textContent = "folder-picker unsupported → files will download (use Chrome/Edge)";
}

async function writeTo(name, bytes, type){
  if (dirHandle){
    const fh = await dirHandle.getFileHandle(name, { create:true });
    const w = await fh.createWritable();
    await w.write(bytes); await w.close();
  } else {
    const blob = new Blob([bytes], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
}

function to565(imageData, w, h){
  const px = imageData.data;
  const buf = new Uint8Array(8 + w*h*2);
  buf[0]=67; buf[1]=53; buf[2]=54; buf[3]=53;             // "C565"
  buf[4]=w&255; buf[5]=(w>>8)&255; buf[6]=h&255; buf[7]=(h>>8)&255;
  let o=8;
  for (let i=0;i<w*h;i++){
    const r=px[i*4], g=px[i*4+1], b=px[i*4+2];
    const v=((r>>3)<<11)|((g>>2)<<5)|(b>>3);
    buf[o++]=v&255; buf[o++]=(v>>8)&255;
  }
  return buf;
}

$("go").onclick = async () => {
  if (!files.length){ log("No files.", "bad"); return; }
  const mw = Math.max(1, +$("mw").value|0), mh = Math.max(1, +$("mh").value|0);
  const alsoPng = $("png").checked;
  $("go").disabled = true; $("status").textContent = "converting…";
  $("bar").style.width = "0%";
  let done = 0;
  for (const f of files){
    const name = f.name.replace(/\.[^.]+$/, "");
    try {
      const bmp = await createImageBitmap(f);
      const r = Math.min(mw/bmp.width, mh/bmp.height, 1);
      const dw = Math.max(1, Math.round(bmp.width*r)), dh = Math.max(1, Math.round(bmp.height*r));
      const c = document.createElement("canvas"); c.width=dw; c.height=dh;
      const g = c.getContext("2d"); g.imageSmoothingQuality = "high";
      g.drawImage(bmp, 0, 0, dw, dh);
      const img = g.getImageData(0,0,dw,dh);
      await writeTo(name + ".565", to565(img, dw, dh), "application/octet-stream");
      if (alsoPng) await new Promise(res => c.toBlob(b => { writeTo(name + ".png", b, "image/png").then(res); }, "image/png"));
      log("ok   " + f.name + "  (" + dw + "x" + dh + ")", "ok");
    } catch(e){
      log("fail " + f.name + "  (" + e + ")", "bad");
    }
    done++;
    $("bar").style.width = Math.round(done/files.length*100) + "%";
  }
  $("status").textContent = "done: " + done + " file(s)";
  $("go").disabled = false;
};
</script>
</body>
</html>
