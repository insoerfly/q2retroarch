# ============================================================================
#  launcher.conf  -  что запускать после загрузки системы
# ============================================================================
#    retroarch - сразу запускать RetroArch (штатное меню/игры)  [по умолчанию]
#    custom    - запускать свой лаунчер (исполняемый файл из launcher_path);
#                лаунчер сам должен запускать RetroArch для игр.
#
#  Формат: launcher_mode = retroarch | custom
# ---------------------------------------------------------------------------

# Режим запуска. По умолчанию — RetroArch.
launcher_mode = retroarch
#launcher_mode = custom

# Путь к своему лаунчеру (в системе, обычно на /flash = раздел p1).
# В режиме custom init выполняет: chroot /newroot <launcher_path>
# Если файла нет или он не исполняемый — безопасный откат на RetroArch.
launcher_path = /flash/launcher
#launcher_path = /flash/launcher/launcher

# Аргументы командной строки для своего лаунчера (необязательно).
launcher_args =
#launcher_args = --fullscreen
