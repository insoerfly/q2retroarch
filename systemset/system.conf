# ============================================================================
#  system.conf  -  системные параметры (CPU, swap, hostname)
# ============================================================================
#  Частота CPU (МГц). Для A13 безопасный потолок в сообществе - 912.
#  Наш init выставляет её при загрузке (иначе стоит 384 и всё тормозит).
cpu_mhz   = 912
#cpu_mhz = 1008   # быстрее, но может быть нестабильно/греться

# Governor: conservative | userspace  (в этом ядре performance нет).
# userspace + cpu_mhz - фиксированная частота (рекомендуется).
cpu_gov = userspace

# Размер zram-swap, МБ (0 - выключить). Помогает при нехватке RAM (256 МБ).
zram_mb = 128

# Имя хоста:
hostname = q2
