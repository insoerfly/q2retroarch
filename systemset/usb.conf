# ============================================================================
#  usb.conf  -  режим USB-гаджета (CDC-ACM консоль ИЛИ массасторедж, НЕ вместе)
# ============================================================================
#  Приставка по USB может работать в одном из режимов (одновременно нельзя):
#
#    console  - USB-консоль (ttyGS0): подключаешься с ПК терминалом (115200),
#               получаешь root-shell. Карта при этом НЕ монтируется на ПК.
#    storage  - SD-карта видна на ПК как обычная флешка (массасторедж).
#               Консоли при этом нет.
#    off      - USB-гаджет выключен (ни консоли, ни флешки).
#
#  ПРИМЕЧАНИЕ: вендорский UDC на A13 не умеет корректно работать "вместе"
#  (ACM+MS): хост начинает пере-инициализировать композит каждые ~20 c, из-за
#  чего консоль отваливается. Поэтому режимы разделены.
#
#  Формат: usb_mode = console | storage | off
# ---------------------------------------------------------------------------

# Примеры (раскомментируй нужный):
usb_mode = storage
#usb_mode = console
#usb_mode = off

# Имя ACM-устройства в системе (обычно оставить как есть):
usb_acm_con = ttyGS0
