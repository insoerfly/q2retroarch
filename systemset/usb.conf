# ============================================================================
#  usb.conf  -  USB-гаджет: отладочная консоль ИЛИ выключено
# ============================================================================
#  Два режима:
#
#    console  - USB-консоль (CDC-ACM, ttyGS0). Подключаешься с ПК терминалом
#               (115200) и получаешь root-shell. Нужно для отладки.
#    off      - USB-гаджет выключен (ни консоли, ни флешки).
#
#  Массасторедж убран (работал нестабильно).
#
#  Формат: usb_mode = console | off
# ---------------------------------------------------------------------------

usb_mode = console
#usb_mode = off

# Имя ACM-устройства (обычно оставить как есть):
usb_acm_con = ttyGS0
