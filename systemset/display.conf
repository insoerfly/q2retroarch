# ============================================================================
#  display.conf  -  что показывать на экране при загрузке
# ============================================================================
#    logo    - показывать только логотип/сплэш (тихая загрузка)
#    console - выводить загрузочную консоль (ядро/init/A-13) прямо на LCD
#    off     - чёрный экран до запуска RetroArch
#
#  Формат: boot_display = logo | console | off
# ---------------------------------------------------------------------------

# Примеры:
boot_display = logo
#boot_display = console
#boot_display = off

# Тишина ядра (quiet в bootargs): меньше сообщений ядра в загрузке
# (0 - выключить тишину и видеть всё, 1 - тихо)
kernel_quiet = 1

# Подсветка при загрузке: 1 - включить сразу, 0 - ждать RetroArch
backlight_early = 1
