# ============================================================================
#  logo.conf  -  загрузочный логотип и консольный текст на экране
# ============================================================================
#  Управляет тем, что видно на LCD при загрузке.
#
#    logo_enable = 1  - показать загрузочный логотип (картинку)
#    logo_enable = 0  - не показывать
#
#    hide_text = 1    - скрыть текстовую консоль ядра/init с LCD
#    hide_text = 0    - оставить текстовый вывод (для отладки)
#
#    logo_file     - файл картинки (raw, 320x240, 32bpp BGRA)
#    logo_hold_ms  - сколько держать логотип перед стартом RetroArch, мс
#
#  При logo_enable=1 и hide_text=1 экран занимает логотип (без текста) —
#  как «тихая» загрузка. Для отладки поставь hide_text = 0.
# ---------------------------------------------------------------------------

# Примеры:
logo_enable  = 1
hide_text    = 1

#logo_enable = 0
#hide_text   = 0

logo_file    = /flash/logo.raw
logo_hold_ms = 3000
