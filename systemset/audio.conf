# ============================================================================
#  audio.conf  -  аудио
# ============================================================================
#  Устройство ALSA для RetroArch. На этой плате рабочий вариант - "plughw:0,0"
#  (как у вендора). С пустым значением/default RetroArch висит в PREPARED и
#  звука нет вообще.
audio_device = plughw:0,0
audio_driver = alsa
audio_rate   = 48000

# Громкость мастер-микшера (0..63):
master_volume = 63

# Наушники работают; внутренний динамик (PA) - отдельная задача (см. доки).
