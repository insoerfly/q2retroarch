# ============================================================================
#  key.conf  -  переназначение кнопок (раскладка Q2 по умолчанию)
# ============================================================================
#  Слева - действие (что кнопка делает), справа - физический пин SoC.
#  Пины указываются без буквы "P": E11 = PE11, B16 = PB16.
#
#  Значения по умолчанию (эмпирически подтверждено для ревизии Q2):
#    up=E11  down=E10  left=E9  right=E8
#    a=E2  b=E4  x=E3  y=E5  l=E7  r=E6
#    start=E0  select=B16  menu=E1
#
#  Внимание: НЕ менять на пины, помеченные как занятые (LCD/подсветка/питание).
# ---------------------------------------------------------------------------

# --- D-pad ---
up     = E11
down   = E10
left   = E9
right  = E8

# --- Кнопки действий ---
a      = E2
b      = E4
x      = E3
y      = E5
l      = E7
r      = E6

# --- Сервисные ---
start  = E0
select = B16
# menu = кнопка, открывающая меню RetroArch (hotkey+menu_toggle)
menu   = E1

# Активный уровень кнопок (обычно 0 = нажатие тянет в землю):
active_low = 1
