# ============================================================================
#  log.conf  -  ведение логов
# ============================================================================
#  Управляет записью логов загрузки и RetroArch. Выключение экономит ресурс
#  SD-карты и ускоряет загрузку/работу.
#
#    log_enable = 1  - писать логи
#    log_enable = 0  - не писать логи
#
#  Что пишется при log_enable=1:
#    /flash/RETRO.LOG           - лог нашего init (a13init): CPU, mount, USB, ...
#    /flash/RA.LOG              - stdout RetroArch (то, что было в консоль)
#    /storage/logs/retroarch.log- подробный лог RetroArch (log_to_file)
# ---------------------------------------------------------------------------

# Примеры:
log_enable = 0
#log_enable = 1

# Куда писать подробный лог RetroArch (log_dir в retroarch.cfg):
log_dir = /storage/logs

# Уровень подробности RetroArch: 0=обычный, 1=verbose, 2=debug
# (влияет на retroarch.cfg: log_verbosity)
log_verbosity = 0
